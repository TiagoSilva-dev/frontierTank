<!-- Mobile shell (docs/MOBILE.md). tools/web_build.py injects this before </head> of the Godot export. -->
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gustfire">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<style>
html, body {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	touch-action: none;
}
#gf-turn, #gf-hint {
	display: none;
	position: fixed;
	z-index: 10;
	left: 0; right: 0;
	box-sizing: border-box;
	font: 18px/1.35 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	color: #f6e7c1;
	text-align: center;
}
#gf-turn {
	top: 0; bottom: 0;
	padding: 0 32px;
	background: #14100c;
	flex-direction: column;
	align-items: center;
	justify-content: center;
}
#gf-turn .phone {
	width: 44px; height: 76px;
	margin-bottom: 22px;
	border: 4px solid #f0b33a;
	border-radius: 10px;
	animation: gf-turn 2.4s ease-in-out infinite;
}
@keyframes gf-turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
/* Portrait on a phone or tablet: ask to rotate (the game is 16:9 landscape). */
@media (orientation: portrait) and (pointer: coarse) { #gf-turn { display: flex; } }
#gf-hint {
	bottom: 0;
	padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
	background: rgba(20, 16, 12, 0.94);
	font-size: 15px;
}
</style>
<script>
(function () {
	var lang = (navigator.language || 'en').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en';
	var text = {
		pt: { turn: 'Gire o aparelho para jogar na horizontal.', hint: 'Para jogar em tela cheia: toque em Compartilhar e em "Adicionar à Tela de Início".' },
		en: { turn: 'Rotate your device to play in landscape.', hint: 'For full screen: tap Share, then "Add to Home Screen".' }
	}[lang];
	var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
	var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches);
	// The game reads these (client/systems/touch_mode.gd): a phone or tablet (the main pointer is
	// a finger; a touch laptop keeps the mouse interface), and whether the page is installed.
	window.gfTouch = coarse;
	window.gfStandalone = standalone;

	document.addEventListener('DOMContentLoaded', function () {
		var turn = document.createElement('div');
		turn.id = 'gf-turn';
		turn.innerHTML = '<div class="phone"></div><div>' + text.turn + '</div>';
		document.body.appendChild(turn);
		var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
		if (ios && !standalone && coarse) {
			var hint = document.createElement('div');
			hint.id = 'gf-hint';
			hint.textContent = text.hint;
			hint.style.display = 'block';
			hint.addEventListener('touchstart', function () { hint.remove(); });
			setTimeout(function () { hint.remove(); }, 12000);
			document.body.appendChild(hint);
		}
	});

	// Safari ignores user-scalable=no: block the pinch and the double-tap zoom ourselves.
	['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
		document.addEventListener(name, function (event) { event.preventDefault(); });
	});
	document.addEventListener('touchmove', function (event) {
		if (event.touches.length > 1) { event.preventDefault(); }
	}, { passive: false });
	document.addEventListener('contextmenu', function (event) { event.preventDefault(); });

	// Android Chrome: the first touch goes to full screen and locks the landscape (it needs a gesture).
	// iPhone Safari has no full screen for pages: the installed page (Add to Home Screen) is the way.
	var asked = false;
	function immersive() {
		if (asked || standalone) { return; }
		asked = true;
		var root = document.documentElement;
		var request = root.requestFullscreen || root.webkitRequestFullscreen;
		if (!request) { return; }
		try {
			var result = request.call(root);
			var lock = function () {
				if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(function () {}); }
			};
			if (result && result.then) { result.then(lock).catch(function () {}); } else { lock(); }
		} catch (error) { /* a browser that refuses: the game still runs */ }
	}
	document.addEventListener('touchend', immersive, { once: true, passive: true });

	// Keep the screen on during a battle (only on https or localhost).
	function wake() {
		try {
			if (navigator.wakeLock && document.visibilityState === 'visible') { navigator.wakeLock.request('screen').catch(function () {}); }
		} catch (error) { /* not allowed here */ }
	}
	document.addEventListener('visibilitychange', wake);
	document.addEventListener('touchend', wake, { once: true, passive: true });
})();
</script>
