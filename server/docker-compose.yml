# Frontier Tank online: PostgreSQL + API (Go) + one game server (Godot headless) + the
# web game (nginx), all on one machine.
#   tools/local.sh (or SubirLocal.cmd on Windows) creates .env and runs everything, or:
#   cd server && cp .env.example .env   (then change the passwords and the key)
#   docker compose up --build
# Players open http://localhost:8000 (WEB_PORT): nginx serves the web game and forwards
# /v1/ to the API and /ws to the game server, so only that port needs to be open.
# The API (8080) and the game server (7350) are also published for the desktop game,
# on 127.0.0.1 only unless API_BIND / GAME_BIND say otherwise.
name: frontier-tank

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: frontier
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: frontier
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # POSTGRES_PASSWORD only counts when the volume is empty: on an existing volume the
      # old password stays and the API fails with "password authentication failed". So once
      # per container (a new DB_PASSWORD makes compose create a new one) the password of
      # .env is written to the database through the local socket, which needs none.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U frontier -d frontier && { [ -f /tmp/password-set ] ||
          { echo "ALTER ROLE frontier PASSWORD :'pw'" |
          psql -q -v ON_ERROR_STOP=1 -v pw="$$POSTGRES_PASSWORD" -U frontier -d frontier &&
          touch /tmp/password-set; }; }
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The password goes apart (pgx reads PGPASSWORD): in the URL a # ? / or % of it would
      # change what is sent.
      DATABASE_URL: postgres://frontier@db:5432/frontier?sslmode=disable
      PGPASSWORD: ${DB_PASSWORD}
      PUBLIC_ADDR: ":8080"
      INTERNAL_ADDR: ":8081"
      INTERNAL_KEY: ${INTERNAL_KEY:?set INTERNAL_KEY in .env}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN:-*}
      # The web players come through nginx, which sends their address in X-Forwarded-For
      # (login limit per IP and the access log). Keep 8080 closed to the outside.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Privacy (launch checklist): the version of legal/*.md players must accept and how
      # long the logs are kept (see the Privacy Policy).
      LEGAL_VERSION: ${LEGAL_VERSION:-2026-09-25}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-90}
      ACCESS_LOG_DAYS: ${ACCESS_LOG_DAYS:-183}
      REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-180}
      # Steam (docs/STEAM.md): without the app id and the publisher key, Steam is off.
      STEAM_APP_ID: ${STEAM_APP_ID:-0}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      STEAM_IDENTITY: ${STEAM_IDENTITY:-frontiertank}
      STEAM_MICROTXN_SANDBOX: ${STEAM_MICROTXN_SANDBOX:-1}
      ORDER_RETENTION_DAYS: ${ORDER_RETENTION_DAYS:-1826}
    ports:
      # Only the public API is published; 8081 (internal) stays inside the network.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"
    networks:
      default:
        # Godot's HTTP client refuses host names shorter than 4 letters ("api").
        aliases: [frontier-api]

  game:
    build:
      context: ..
      dockerfile: server/docker/game.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    stop_grace_period: 20s
    environment:
      FT_API: http://frontier-api:8081
      FT_API_KEY: ${INTERNAL_KEY}
      FT_ID: s1
      FT_NAME: ${GAME_NAME:-S1 · Nova Era}
      FT_PORT: "7350"
      # Through the web port (nginx /ws); the desktop game can use it too.
      FT_PUBLIC_URL: ${GAME_PUBLIC_URL:-ws://localhost:8000/ws}
      FT_CAPACITY: ${GAME_CAPACITY:-500}
      FT_TEST_COUPONS: ${TEST_COUPONS:-0}
      FT_BOT_FILL: ${BOT_FILL_SECONDS:-20}
      # Different players reporting someone in 10 minutes that mute them for 10 minutes.
      FT_REPORT_MUTE: ${REPORT_MUTE:-3}
      FT_STOP_FILE: /tmp/frontier-stop
    ports:
      - "${GAME_BIND:-127.0.0.1}:${GAME_PORT:-7350}:7350"

  web:
    build:
      context: ..
      dockerfile: server/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
      - game
    ports:
      - "${WEB_PORT:-8000}:80"

volumes:
  db-data:
