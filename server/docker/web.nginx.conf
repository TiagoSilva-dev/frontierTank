# Frontier Tank web: one address for everything the browser needs.
#   /      the game exported for the browser (build/web, no threads: no COOP/COEP)
#   /v1/   the public API (the web game looks for it on its own address)
#   /ws    the game server's WebSocket (GAME_PUBLIC_URL=ws://<host>:<WEB_PORT>/ws)
# Names are resolved on each request, so nginx starts even before the API and the game
# server, and follows them when they restart.
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	resolver 127.0.0.11 valid=10s ipv6=off;

	# The .wasm and .pck shrink to about half.
	gzip on;
	gzip_min_length 1024;
	gzip_types application/wasm application/octet-stream application/javascript text/javascript text/css application/json;

	location / {
		try_files $uri $uri/ =404;
		# A new build is picked up at once (the files are revalidated, not downloaded again).
		add_header Cache-Control "no-cache";
	}

	location /v1/ {
		set $api http://api:8080;
		proxy_pass $api;
		proxy_set_header Host $host;
		# The API keeps the player's address (login limit and access log, TRUST_PROXY=1).
		# Replaced, never appended: the player cannot send a fake one.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		client_max_body_size 1m;
	}

	location = /ws {
		set $game http://game:7350;
		proxy_pass $game;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		# Battles are long; the game pings every 5 s.
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
}
