server {
    listen 80;
    server_name gustfire.online www.gustfire.online;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/conf.d/gustfire-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://gustfire.online$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.gustfire.online;
    ssl_certificate /etc/letsencrypt/live/gustfire.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gustfire.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://gustfire.online$request_uri;
}

server {
    listen 443 ssl;
    server_name gustfire.online;
    ssl_certificate /etc/letsencrypt/live/gustfire.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gustfire.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GustfireTLS:1m;
    ssl_session_timeout 1d;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /v1/ {
        set $frontier_api http://frontier-api:8080;
        proxy_pass $frontier_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 1m;
    }

    location / {
        set $frontier http://frontier-tank-web:80;
        proxy_pass $frontier;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
